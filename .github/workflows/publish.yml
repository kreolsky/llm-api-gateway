# Publish a release tag: the router image to ghcr (:X.Y.Z and :stable) and a GitHub Release
# whose body is the tag's docs/release note. Manual run = (re)create the Release of an
# existing tag (backfill or a failed run); it never rebuilds the image. Each new Release is
# marked Latest, so backfill oldest tag first.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to create the GitHub Release for (e.g. v1.3.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # WHY: /health reports src/VERSION; the deploy host stamps it after rsync, the image stamps it here.
      - run: echo "${GITHUB_REF_NAME}" > src/VERSION
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kreolsky/llm-api-gateway:${{ steps.tag.outputs.version }}
            ghcr.io/kreolsky/llm-api-gateway:stable

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # WHY: checkout of the TAG — the release skill commits the note before tagging, so
      # the tagged tree always carries its own note, on a push and on a manual run alike.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: |
          note=$(ls docs/release/release-*-"${TAG}".md)
          # The H1 repeats the Release title; the body starts after it.
          tail -n +2 "$note" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
