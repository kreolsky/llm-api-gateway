# Publish the router image to ghcr on a release tag: :X.Y.Z and :stable.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # WHY: /health reports src/VERSION; the deploy host stamps it after rsync, the image stamps it here.
      - run: echo "${GITHUB_REF_NAME}" > src/VERSION
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kreolsky/llm-api-gateway:${{ steps.tag.outputs.version }}
            ghcr.io/kreolsky/llm-api-gateway:stable
